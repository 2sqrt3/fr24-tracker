name: Track NH851 (JA787A)

on:
  # 允許在 GitHub 網頁手動點擊 "Run workflow" 立即測試
  workflow_dispatch:

  schedule:
    # 1. 派飛確認時段：台灣時間 08:30、08:45、09:00、09:15 (對應 UTC 00:30 - 01:15，涵蓋航班延誤起飛)
    - cron: '30,45 0 * * *'
    - cron: '0,15 1 * * *'

    # 2. 在途追蹤時段：台灣時間 09:30 - 11:45 每 15 分鐘檢查一次 (對應 UTC 01:30 - 03:45)
    # 註：若階段一未命中 JA787A，程式會直接結束，不會消耗任何 FR24 點數
    - cron: '30,45 1 * * *'
    - cron: '*/15 2-3 * * *'

jobs:
  check-flight:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 讀取當日追蹤狀態快取（防止重複通知與無效查詢）
      - name: Restore flight state cache
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: flight_state.json
          key: flight-state-${{ github.run_id }}
          restore-keys: |
            flight-state-

      - name: Run tracker script
        env:
          FR24_API_TOKEN: ${{ secrets.FR24_API_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python tracker.py

      # 將更新後的狀態存回快取供下一次排程讀取
      - name: Save flight state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: flight_state.json
          key: flight-state-${{ github.run_id }}
