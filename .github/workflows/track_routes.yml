name: Track Multi-Routes to TPE

on:
  workflow_dispatch:

  schedule:
    # 每天台灣時間 05:13 (UTC 21:13) 執行一次
    - cron: '13 21 * * *'
    # 每天台灣時間 12:13 (UTC 04:13) 執行一次
    - cron: '13 4 * * *'
    # 每天台灣時間 16:13 (UTC 08:13) 執行一次
    - cron: '13 8 * * *'

jobs:
  check-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
#診斷實際觸發來源
      - name: Diagnose schedule
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "UTC: $(date -u)"
          echo "Taipei: $(TZ=Asia/Taipei date)"

          
      - name: Run multi-route tracker
        env:
          FR24_API_TOKEN: ${{ secrets.FR24_API_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python track_routes.py
