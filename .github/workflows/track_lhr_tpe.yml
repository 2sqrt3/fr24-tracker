name: Track LHR-TPE (Exclude CI82)

on:
  workflow_dispatch:

  schedule:
    # 每天台灣時間 05:00 (UTC 21:00) 執行一次
    - cron: '0 21 * * *'
    # 每天台灣時間 12:00 (UTC 04:00) 執行一次
    - cron: '0 4 * * *'

jobs:
  check-lhr-tpe:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run LHR-TPE tracker
        env:
          FR24_API_TOKEN: ${{ secrets.FR24_API_TOKEN }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python track_lhr_tpe.py
